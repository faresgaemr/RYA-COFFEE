<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rya coffee</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rya coffee">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECE7E1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="rya-icon.png">
<link rel="icon" type="image/png" href="rya-icon.png">
<style>
  html,body{margin:0;height:100%;height:100dvh;overflow:hidden;background:#ECE7E1;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif}
  body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
  #bell{display:flex;align-items:center;gap:10px;background:#1B2F4F;color:#fff;padding:10px 14px;font-size:14px;line-height:1.5}
  #bell[hidden]{display:none}
  #bell span{flex:1}
  #bell button[hidden]{display:none}
  #bell button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:8px 14px;background:#fff;color:#1B2F4F;cursor:pointer}
  #bell .x{background:transparent;color:#fff;padding:8px}
  #frameWrap{flex:1;position:relative;overflow:auto;-webkit-overflow-scrolling:touch}
  iframe{border:0;position:absolute;inset:0;width:100%;height:100%;display:block}
  #inst{display:flex;align-items:center;gap:10px;background:#fff;color:#1B2F4F;padding:10px 14px;font-size:14px;line-height:1.5;border-bottom:1px solid #D9D2CB}
  #inst[hidden]{display:none}
  #inst span{flex:1}
  #inst b{font-weight:700}
  #inst button{font:inherit;font-weight:700;border:0;border-radius:9px;padding:8px 14px;background:#1B2F4F;color:#fff;cursor:pointer}
  #inst .x{background:transparent;color:#1B2F4F;padding:8px}
  #ptr{position:fixed;inset:0;z-index:9;background:rgb(15 26 43 / .6);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));color:#fff;text-align:center;gap:8px}
  #ptr[hidden]{display:none}
  #ptr .card{background:#fff;color:#1B2F4F;border-radius:14px;padding:12px 16px;max-width:280px;line-height:1.7;font-size:15px}
  #ptr .arrow{font-size:60px;line-height:1;animation:bob 1s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(10px)}}
</style>
<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
<!-- شريط حفظ التطبيق على الشاشة الرئيسية -->
<div id="inst" hidden>
  <span id="instTxt">📲 ثبّت تطبيق <b>Rya</b> على جوالك</span>
  <button id="instBtn" type="button">تثبيت</button>
  <button id="instX" class="x" type="button" aria-label="إخفاء">✕</button>
</div>
<div id="ptr" hidden>
  <div class="card">1. اضغط زر المشاركة <b>⬆︎</b> اللي تحت<br><small>(إذا ما شفته: اضغط <b>⋯</b> وبعدها «مشاركة»)</small><br>2. اختر <b>«إضافة إلى الشاشة الرئيسية»</b><br>3. اضغط <b>«إضافة»</b></div>
  <div class="arrow">⬇</div>
  <small style="opacity:.85">اضغط في أي مكان عشان يختفي</small>
</div>
<!-- شريط تفعيل الإشعارات (يطلع بس إذا الجوال يدعمها وما تفعّلت) -->
<div id="bell" hidden>
  <span id="bellTxt">🔔 فعّل التنبيهات عشان يوصلك إشعار أول ما يجهز طلبك</span>
  <button id="bellOn" type="button">فعّل</button>
  <button id="bellX" class="x" type="button" aria-label="إخفاء">✕</button>
</div>
<!-- نسخة التطبيق من بطاقة ولاء Rya: تعرض نظام الولاء من Google Apps Script بأيقونة Rya -->
<div id="frameWrap"><iframe id="rya" title="Rya coffee" allow="autoplay; clipboard-write"></iframe></div>
<script>
  var EXEC = "https://script.google.com/macros/s/AKfycbzlzX0oYt1o0XAChJR1vTn0quzYmQeV73WbeLYPECiQvR85zmz1BX9fTAAfhe0xh0mVBg/exec";
  var ONESIGNAL_APP_ID = "c9795a37-34c2-4f86-858e-eceb48096071";

  var params = new URLSearchParams(location.search);
  var t = (params.get("t") || "").replace(/[^a-f0-9]/g, "");
  try { if (t) localStorage.setItem("rya_t", t); else t = localStorage.getItem("rya_t") || ""; } catch (e) {}
  if (t && !params.get("t")) history.replaceState(null, "", "?t=" + t);
  document.getElementById("rya").src = EXEC + "?w=1" + (t ? "&t=" + t : "");

  // ---- الإشعارات (OneSignal) ----
  var osReady = false, osError = "";
  window.OneSignalDeferred = window.OneSignalDeferred || [];
  var standaloneApp = window.navigator.standalone || window.matchMedia("(display-mode: standalone)").matches;
  var iosDevice = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  function linkUser() {
    if (!osReady || !t) return;
    OneSignalDeferred.push(function (OneSignal) { OneSignal.login(t); });
  }
  function bellMsg(text, btn) {
    document.getElementById("bellTxt").innerHTML = text;
    var b = document.getElementById("bellOn");
    b.hidden = !btn; if (btn) b.textContent = btn;
    document.getElementById("bell").hidden = false;
  }
  function updateBell() {
    var bell = document.getElementById("bell");
    var hidden = false; try { hidden = localStorage.getItem("rya_bell_x") === "1"; } catch (e) {}
    if (hidden || (iosDevice && !standaloneApp) || !("Notification" in window) || !("serviceWorker" in navigator)) { bell.hidden = true; return; }
    var perm = Notification.permission;
    if (perm === "granted") { bell.hidden = true; return; }
    if (perm === "denied") { bellMsg("🔕 التنبيهات مقفولة لهذا التطبيق. عشان تفعّلها: احذف أيقونة Rya وأضفها من جديد.", ""); return; }
    bellMsg("🔔 فعّل التنبيهات عشان يوصلك إشعار أول ما يجهز طلبك", "فعّل");
  }
  if (ONESIGNAL_APP_ID && ONESIGNAL_APP_ID.indexOf("ضع_هنا") !== 0) {
    OneSignalDeferred.push(async function (OneSignal) {
      try {
        await OneSignal.init({
          appId: ONESIGNAL_APP_ID.trim(),
          serviceWorkerPath: "RYA-COFFEE/OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/RYA-COFFEE/" },
          notifyButton: { enable: false },
          promptOptions: { slidedown: { prompts: [] } }
        });
        osReady = true; linkUser(); updateBell();
        OneSignal.Notifications.addEventListener("permissionChange", function () { linkUser(); updateBell(); });
        // إذا الإذن موجود من قبل نتأكد إنه مشترك
        if (Notification.permission === "granted") { try { OneSignal.User.PushSubscription.optIn(); } catch (e) {} }
      } catch (e) { osError = (e && e.message) || String(e); }
    });
  }
  updateBell();
  document.getElementById("bellOn").onclick = function () {
    if (osError) { bellMsg("تعذّر تفعيل التنبيهات: " + osError, "إعادة"); osError = ""; return; }
    if (!osReady || !window.OneSignal || !OneSignal.Notifications) { bellMsg("لحظة، نجهّز التنبيهات… اضغط مرة ثانية بعد ثواني", "فعّل"); return; }
    OneSignal.Notifications.requestPermission().then(function () { linkUser(); updateBell(); });
  };
  document.getElementById("bellX").onclick = function () {
    try { localStorage.setItem("rya_bell_x", "1"); } catch (e) {}
    document.getElementById("bell").hidden = true;
  };

  // ---- حفظ التطبيق على الشاشة الرئيسية ----
  var deferredInstall = null;
  var standaloneNow = window.navigator.standalone || window.matchMedia("(display-mode: standalone)").matches;
  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  var isIOSSafari = isIOS && !/CriOS|FxiOS|EdgiOS|GSA\//.test(navigator.userAgent);
  function instHidden() { try { return localStorage.getItem("rya_inst_x") === "1"; } catch (e) { return false; } }
  function showInst(text, btn) {
    if (standaloneNow || instHidden()) return;
    document.getElementById("instTxt").innerHTML = text;
    document.getElementById("instBtn").textContent = btn;
    document.getElementById("inst").hidden = false;
  }
  // أندرويد: نافذة التثبيت الحقيقية
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault(); deferredInstall = e;
    showInst('📲 ثبّت تطبيق <b>Rya</b> على جوالك', "تثبيت");
  });
  window.addEventListener("appinstalled", function () { document.getElementById("inst").hidden = true; });
  // آيفون (Safari): Apple ما تسمح بزر تثبيت، فنأشّر على زر المشاركة
  if (isIOSSafari) showInst('📲 أضف <b>Rya</b> لشاشتك الرئيسية', "وريني");
  else if (isIOS) showInst('📲 افتح الصفحة في <b>Safari</b> عشان تقدر تضيفها لشاشتك', "تمام");
  document.getElementById("instBtn").onclick = function () {
    if (deferredInstall) {
      deferredInstall.prompt();
      deferredInstall.userChoice.then(function (c) { if (c.outcome === "accepted") document.getElementById("inst").hidden = true; deferredInstall = null; });
    } else if (isIOSSafari) {
      var p = document.getElementById("ptr"); p.hidden = false;
      clearTimeout(p._t); p._t = setTimeout(function () { p.hidden = true; }, 10000);
    } else { document.getElementById("inst").hidden = true; }
  };
  document.getElementById("ptr").onclick = function () { this.hidden = true; };
  document.getElementById("instX").onclick = function () {
    try { localStorage.setItem("rya_inst_x", "1"); } catch (e) {}
    document.getElementById("inst").hidden = true;
  };

  // صفحة الولاء ترسل رابط الدخول بعد ما يدخل الزبون، فنحفظه هنا ونربطه بالإشعارات
  window.addEventListener("message", function (e) {
    var host = ""; try { host = new URL(e.origin).hostname; } catch (x) {}
    if (!/\.googleusercontent\.com$/.test(host)) return;
    if (!e.data || typeof e.data.rya_t !== "string") return;
    var nt = e.data.rya_t.replace(/[^a-f0-9]/g, "");
    try { if (nt) localStorage.setItem("rya_t", nt); else localStorage.removeItem("rya_t"); } catch (x) {}
    history.replaceState(null, "", nt ? "?t=" + nt : location.pathname);
    if (nt) { t = nt; linkUser(); }
    else if (osReady) { t = ""; OneSignalDeferred.push(function (OneSignal) { OneSignal.logout(); }); }
    updateBell();
  });
</script>
</body>
</html>
